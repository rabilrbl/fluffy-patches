openapi: 3.0.3
info:
  title: JioTV Mobile API
  description: 'Complete OpenAPI specification for JioTV Mobile (v7.1.7, versionCode 371) network requests.

    Reverse-engineered from decompiled APK smali. Environment switching controlled by

    `JioTVApplication.usePreProdEnv` boolean.

    '
  version: 7.1.7
  license:
    name: Unlicensed
  contact:
    name: JioTV Mobile
  x-verification-note: Auth flow verified. OTP send (POST v1/loginotp/send with base64-encoded number) returns 204.
    OTP verify (POST v2/loginotp/verify) returns 200 with authToken, ssoToken, refreshToken. Required headers for authenticated
    endpoints: appName= RJIL_JioTV, ssotoken, accesstoken, deviceId, uniqueId, usertype, versionCode=371, os=android, devicetype=phone, Connection=close.
    v2.x endpoints on tv.media.jio.com/apis/ respond with 400 (reachable, need correct body params).
    v3.0+ endpoints on jiotvapi.media.jio.com/ return 404 (may be decommissioned or require different auth).
    CDN endpoints (jiotvapi.cdn.jio.com) return 200 (dictionary verified).
servers:
- url: https://tv.media.jio.com/apis
  description: Default - Production Main API (each path overrides with exact base URL)
  x-verified-status: 404-requires-auth
tags:
- name: Authentication
  description: OTP login, token exchange, refresh
- name: Home & Discovery
  description: Home tabs, carousels, featured content, categories
- name: Channels & EPG
  description: Channel listings, schedules, EPG
- name: Playback
  description: Stream URLs, DRM, playback rights
- name: Search
  description: Search and autocomplete
- name: Content & VOD
  description: Movies, shows, metadata, cinema
- name: User Lists
  description: Favorites, recents, watchlists, recordings
- name: Subscription
  description: Plans, packages, concurrent streams
- name: Sports & Scorecard
  description: Live sports, scores, tournaments
- name: Configuration
  description: App config, resources, dictionary, version check
- name: Analytics
  description: Event tracking, cinema analytics, begin session
- name: Games
  description: JioGames SDK, arena, esports
- name: JioStream Mini
  description: Mini app video player, comments, likes, watch later
- name: Watch Party
  description: JioWebView SDK — room creation, JWT, logging
- name: Ads
  description: JioAds SDK — Mercury ad delivery, VMAP, tracking
- name: Miscellaneous
  description: Coupons, feedback, share, location, EMBMS, camera
paths:
  /v1/loginotp/send:
    post:
      tags:
      - Authentication
      summary: Send OTP for login
      operationId: sendOtp
      servers:
      - url: https://jiotvapi.media.jio.com/userservice/apis
        description: Production
      - url: https://jiotvqaapi.jio.ril.com/userservice/apis
        description: PreProd/QA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
      x-source: JioTvLoginApiInterface (smali_classes4)
      x-verified: true
      x-verified-note: 'Confirmed: POST with {"number":"<base64-phone>"} returns 204 No Content on success'
      description: Send OTP for mobile login
  /v2/loginotp/verify:
    post:
      tags:
      - Authentication
      summary: Verify OTP and authenticate
      operationId: verifyOtp
      servers:
      - url: https://jiotvapi.media.jio.com/userservice/apis
        description: Production
      - url: https://jiotvqaapi.jio.ril.com/userservice/apis
        description: PreProd/QA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpCheckRequest'
      responses:
        '200':
          description: Auth response with tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOtpResponse'
      x-source: JioTvLoginApiInterface (smali_classes4)
      x-verified: true
      x-verified-note: 'Confirmed: POST with {"number":"<base64-phone>","otp":"002917","deviceInfo":{...}} returns 200 with authToken, ssoToken, refreshToken, sessionAttributes'
      description: Verify OTP and authenticate
