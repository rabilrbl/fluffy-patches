components:
  securitySchemes:
    ssoToken:
      type: apiKey
      in: header
      name: ssotoken
    authToken:
      type: apiKey
      in: header
      name: auth
    lbcookie:
      type: apiKey
      in: header
      name: lbcookie
  schemas:
    ResponseBaseModel:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
        data:
          type: object
        message:
          type: string
    OtpRequest:
      type: object
      required:
        - number
      properties:
        number:
          type: string
          description: Base64-encoded phone number (with +91 prefix). Encoded via Base64.NO_WRAP
      x-verified: true
      x-verified-note: 'Confirmed working: POST with {"number":"KzkxODY2MDYyMjY5OA=="} returns 204'
    OtpCheckRequest:
      type: object
      required:
        - number
        - otp
      properties:
        number:
          type: string
          description: Base64-encoded phone number (with +91 prefix). Encoded via Base64.NO_WRAP
        otp:
          type: string
          description: 6-digit OTP code
        deviceInfo:
          $ref: '#/components/schemas/DeviceInfo'
    DeviceInfo:
      type: object
      properties:
        consumptionDeviceName:
          type: string
          description: 'Device name: Build.BRAND + " " + Build.MODEL'
        info:
          $ref: '#/components/schemas/DeviceInfoInner'
    DeviceInfoInner:
      type: object
      properties:
        type:
          type: string
          description: Always "android"
        platform:
          $ref: '#/components/schemas/PlatformInfo'
        androidId:
          type: string
          description: Settings.Secure.ANDROID_ID
    PlatformInfo:
      type: object
      properties:
        name:
          type: string
          description: Build.PRODUCT
    VerifyOtpResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            authToken:
              type: string
              description: JWT access token for API authentication
            ssoToken:
              type: string
              description: SSO token for session management (JWT)
            refreshToken:
              type: string
              description: UUID refresh token
            tempToken:
              type: string
            sessionAttributes:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    commonName:
                      type: string
                    mobile:
                      type: string
                    preferredLocale:
                      type: string
                    ssoLevel:
                      type: string
                    subscriberId:
                      type: string
                    uid:
                      type: string
                    unique:
                      type: string
                jToken:
                  type: string
                ssoLevel:
                  type: string
                lbCookie:
                  type: string
                newUser:
                  type: boolean
                ip:
                  type: string
                deviceId:
                  type: string
                analyticsId:
                  type: string
            lbCookie:
              type: string
        _metadata:
          type: object
          nullable: true
        request_id:
          type: string
        surrogate_key:
          type: string
      x-verified: true
      x-verified-note: 'Confirmed: POST /v2/loginotp/verify returns 200 with authToken, ssoToken, refreshToken, sessionAttributes'
    DeviceLimitExceeded:
      type: object
      properties:
        message:
          type: string
        show_device_list:
          type: boolean
    RefreshSsoTokenResponse:
      type: object
      properties:
        ssoToken:
          type: string
    ExchangeTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
        deviceId:
          type: string
    ExchangeTokenResponse:
      type: object
      properties:
        authToken:
          type: string
        refreshToken:
          type: string
    GuestAuthRequest:
      type: object
      properties:
        deviceId:
          type: string
    GuestAuthTokenResponse:
      type: object
      properties:
        authToken:
          type: string
    RefreshAuthTokenResponse:
      type: object
      properties:
        authToken:
          type: string
        refreshToken:
          type: string
        deviceLimitExceeded:
          $ref: '#/components/schemas/DeviceLimitExceeded'
    ShortTokenResponse:
      type: object
      properties:
        shortToken:
          type: string
    ExpireAllUsersResponse:
      type: object
      properties:
        authToken:
          type: string
        refreshToken:
          type: string
        ssoToken:
          type: string
    ChannelListRootModel:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        result:
          type: array
          items:
            $ref: '#/components/schemas/ChannelModel'
    ChannelModel:
      type: object
      properties:
        channelId:
          type: integer
          format: int64
        channelName:
          type: string
        channelIdForRedirect:
          type: string
        logoUrl:
          type: string
        channelCategoryId:
          type: integer
        channelLanguageId:
          type: integer
        channelPosition:
          type: integer
        broadcasterId:
          type: integer
        aspectRatio:
          type: string
        isHD:
          type: boolean
        isCatchupAvailable:
          type: boolean
        isFavorite:
          type: boolean
        isPlayAlongEnabled:
          type: integer
        playAlongUrl:
          type: string
        playAlongIconUrl:
          type: string
        businessType:
          type: string
        planType:
          type: string
        screenType:
          type: integer
        isAdsEnabled:
          type: boolean
        isMidRoleEnabled:
          type: boolean
        enableVideoInterstitial:
          type: boolean
        isCam:
          type: integer
        isEmbmsChannel:
          type: boolean
        isFingerPrint:
          type: boolean
        isNewPDP:
          type: integer
        isSoreCardEnabled:
          type: boolean
        concurrencyCode:
          type: integer
        concurrentEnabled:
          type: boolean
        enableMidRollAds:
          type: integer
        preRollAdSpotId:
          type: string
        midRollAdSpotId:
          type: string
        postRollAdSpotId:
          type: string
        nativeInfeedAdSpotId:
          type: string
        midrollCompanionAdSpotId:
          type: string
        prerollCompanionAdSpotId:
          type: string
        carouselAdSpotId:
          type: string
        tab_deep_link:
          type: string
        themeForVr:
          type: integer
        serverDate:
          type: string
        recentsEnabled:
          type: boolean
        showPDPExtra:
          type: boolean
        pdpExtra:
          type: string
    ChannelUrlRequest:
      type: object
      required:
        - channel_id
        - stream_type
      properties:
        channel_id:
          type: integer
          format: int64
          description: Numeric channel identifier
        stream_type:
          type: string
          description: 'Stream type: "Seek" (live), "Catchup" (past), "Vod" (on-demand), "Invalid"'
          enum:
            - Seek
            - Catchup
            - Vod
            - Invalid
        srno:
          type: string
          description: Derived from program serial number (prefixed with "20")
        programId:
          type: string
          description: Program serial number as string
        showtime:
          type: string
          description: Show time with colons stripped (only for Catchup)
        begin:
          type: string
          nullable: true
        end:
          type: string
          nullable: true
      x-verified-note: 'POST /v2.2/getchannelurl/getchannelurl returns 400 (Parameter Missing) - endpoint reachable but needs correct param combo'
    ChannelUrlRequestV2:
      type: object
      required:
        - channel_id
        - stream_type
      properties:
        channel_id:
          type: integer
          format: int64
        stream_type:
          type: string
        srno:
          type: string
        programId:
          type: string
        showtime:
          type: string
          nullable: true
    ChannelUrlModel:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        result:
          type: string
          description: Stream URL
        mpd:
          $ref: '#/components/schemas/Mpd'
        cast:
          type: string
        languages:
